[build]
  command = "KK_NETLIFY_TARGET=admin node scripts/build-netlify.mjs"
  publish = "netlify-admin-dist"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_PUBLIC_KK_STOREFRONT_URL = "https://adela-purchasing-agent-shop.netlify.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
